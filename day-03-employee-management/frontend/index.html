<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">Employee Management</h2>

    <div id="message"></div>

    <div class="card p-4 mb-4">
        <h4>Employee Registration Form</h4>

        <form id="employeeForm">

            <div class="mb-3">
                <label class="form-label">Employee Code</label>
                <input type="text" id="employeeCode" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="fullName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" id="phone" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" id="department" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Role</label>
                <input type="text" id="role" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select id="status" class="form-control" required>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="INACTIVE">INACTIVE</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Employee
            </button>

        </form>
    </div>

    <div class="mb-3">
        <input
            type="text"
            id="searchBox"
            class="form-control"
            placeholder="Search by name or department"
        >
    </div>

    <div class="card p-3">
        <h4>Employee List</h4>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="employeeTableBody">
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
